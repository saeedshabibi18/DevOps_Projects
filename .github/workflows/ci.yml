name: XYZ University Portal — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── JOB 1: TEST BACKEND ───
  test-backend:
    name: Test Node.js Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        # Install dependencies in the project root

      - name: Run tests
        run: npm test

  # ─── JOB 2: BUILD DOCKER IMAGE ───
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t xyz-university-portal:latest ./
        # Build Docker image from the project root

      - name: Verify image was created
        run: docker images

  # ─── JOB 3: PUSH TO DOCKER HUB ───
  push-to-dockerhub:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/xyz-university-portal:latest ./
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/xyz-university-portal:latest